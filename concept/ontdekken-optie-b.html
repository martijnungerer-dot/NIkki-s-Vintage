<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ontdekken – optie B</title>
<!--
  Nikki's Boetiek – Ontdekken, gekozen ontwerp "optie B" (november 2026).
  Eén zelfstandig bestand: geen build, geen opslag, geen verbinding. Alle stukken, prijzen en maten zijn voorbeelden.
  Foto's staan NIET in Git (beeldrechten). Elk stuk toont een tekening; zet lokaal foto's in de map concept/fotos/
  (genegeerd door Git) en vul het veld `foto` hieronder, bijvoorbeeld foto: 'fotos/jas-1.jpg'.
  Ontwerpregels: geen tekst over foto's; knoppen minstens 44 px; universele iconen zonder woorden;
  alles op elk scherm op dezelfde plek; tekst minstens 16 px; maten plat in cm; bontsoort alleen zoals Nikki die vaststelt.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
:root {
  --page: #EFE9E2; --bg: #FAF6F0; --fg: #2E2420; --muted: #6B5A50; --line: #E3DAD0;
  --chip: #F3ECE3; --chip-line: #D9CFC4; --chip-on: #E4D6C5; --band: #F1E9DF; --bracket: #B9AA9C; --photo-bg: #E9E1D6;
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--page); color: var(--fg); font-family: var(--serif); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); }
.note { margin: 0; font-size: 15px; color: var(--muted); text-align: center; max-width: 40ch; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
svg { display: block; }

/* Het scherm: 390 x 844 zoals het ontwerp, krimpt mee op smalle telefoons. */
.ph { position: relative; overflow: hidden; width: min(390px, 100%); height: min(844px, max(620px, calc(100svh - 90px))); border-radius: 44px; border: 1px solid var(--line); box-shadow: 0 18px 50px rgba(40, 28, 22, 0.10); background: var(--bg); display: flex; flex-direction: column; padding: 40px 12px 24px; container-type: inline-size; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px 8px; }
.brand { font-size: 26px; }
.ic { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; display: grid; place-items: center; }

.photo { position: relative; flex: 1 1 auto; min-height: 260px; border-radius: 8px; overflow: hidden; background: var(--photo-bg); touch-action: none; user-select: none; -webkit-user-select: none; }
.track { display: flex; height: 100%; transition: transform 300ms cubic-bezier(0.2, 0.8, 0.2, 1); }
.track.dragging { transition: none; }
.slide { flex: 0 0 100%; height: 100%; overflow: hidden; position: relative; }
.slide img, .slide .drawing { width: 100%; height: 100%; object-fit: cover; object-position: center top; transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1); pointer-events: none; }
.slide.zoomed img, .slide.zoomed .drawing { transform: scale(2.2); }
.hold { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 16px; }
.photo.wissel .track { animation: wissel 260ms ease-out; }
@keyframes wissel { from { opacity: 0.2; } to { opacity: 1; } }
.on-photo { position: absolute; width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; }
.on-photo svg { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35)); }
.arrow-l { left: 4px; top: calc(50% - 22px); }
.arrow-r { right: 4px; top: calc(50% - 22px); }
.photo-acts { position: absolute; right: 4px; bottom: 2px; display: flex; }
.photo-acts .on-photo { position: static; }
.dots { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.5); box-shadow: 0 0 2px rgba(0, 0, 0, 0.3); }
.dots i.on { background: #FFFFFF; }

/* Naam (opent uitleg) en prijs (legt in winkelmand): twee subtiele knoppen van gelijke hoogte. */
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0 12px; box-shadow: inset 0 -1px 0 var(--line); }
.chip { height: 44px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 0; border-radius: 10px; background: var(--chip); transition: background 220ms ease-out; }
.chip:active { background: #EBE2D6; }
.chip.title { flex: 0 1 auto; min-width: 0; text-align: left; }
.chip.title span { font-size: 22px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.price { flex: none; font-size: 22px; white-space: nowrap; }
.chip.price[aria-pressed="true"] { background: var(--chip-on); }

/* Onderrij in een zacht eigen vlak: vorig stuk (terugpijltje), drie volgende stukken, menu. */
.band { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding: 8px; background: var(--band); border-radius: 14px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6); }
.thumbs { display: flex; align-items: center; gap: 8px; }
.th, .shop { position: relative; width: min(52px, calc((100cqw - 88px) / 5)); aspect-ratio: 52 / 64; padding: 3px; border: 1px solid var(--chip-line); border-radius: 10px; background: var(--bg); overflow: hidden; flex: none; transition: transform 120ms ease-out; }
.th:active, .shop:active { transform: scale(0.95); }
.th .face { width: 100%; height: 100%; border-radius: 7px; overflow: hidden; }
.th .face img, .th .face .drawing { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.back-badge { position: absolute; left: 6px; bottom: 6px; width: 20px; height: 20px; border-radius: 10px; background: rgba(250, 246, 240, 0.92); display: grid; place-items: center; }
.shop { background: var(--chip); display: grid; place-items: center; padding: 0; }

/* Panelen groeien uit de knop die ze opent. */
.pop { position: absolute; z-index: 5; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 32px rgba(46, 36, 32, 0.18); animation: groei 220ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes groei { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
.info { left: 12px; right: 12px; top: 92px; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; transform-origin: 20% 100%; }
.menu { right: 16px; width: 200px; padding: 8px; display: flex; flex-direction: column; gap: 6px; border-radius: 14px; transform-origin: bottom right; }
.menu button { height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; font-size: 17px; text-align: left; }
.menu button:active { background: var(--chip); }
.cart { inset: 0; border: 0; border-radius: 0; box-shadow: none; padding: 40px 20px 24px; display: flex; flex-direction: column; transform-origin: bottom right; }
.head { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.ptitle { font-size: 24px; line-height: 1.2; }
.kv { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 17px; }
.muted { color: var(--muted); }
.line { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.line .face { width: 56px; height: 68px; border-radius: 8px; overflow: hidden; flex: none; }
.line .face img, .line .face .drawing { width: 100%; height: 100%; object-fit: cover; display: block; }
.line div.txt { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 18px; }
.checkout { height: 48px; border: 1px solid var(--chip-line); border-radius: 10px; background: var(--chip); font-size: 18px; }

@media (prefers-reduced-motion: reduce) {
  .pop, .photo.wissel .track { animation: none; }
  .track, .slide img, .slide .drawing, .chip, .th, .shop { transition: none; }
}
</style>
</head>
<body>
<p class="note">Ontdekken, optie B. Ontwerp met voorbeeldgegevens; foto's zijn vervangen door tekeningen.</p>

<div class="ph" id="ph">
  <header class="top"><span class="brand">Nikki’s Boetiek</span>
    <button type="button" class="ic" aria-label="Mijn account"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
  </header>

  <div class="photo" id="photo">
    <div class="track" id="track"></div>
    <button type="button" class="on-photo arrow-l" data-act="prev-photo" aria-label="Vorige foto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.6" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" class="on-photo arrow-r" data-act="next-photo" aria-label="Volgende foto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.6" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="photo-acts">
      <button type="button" class="on-photo" aria-label="Delen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.5" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg></button>
      <button type="button" class="on-photo" id="like" data-act="like" aria-label="Vind ik mooi" aria-pressed="false"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.5" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
    </div>
    <div class="dots" id="dots" role="img"></div>
  </div>

  <div class="row" id="row">
    <button type="button" class="chip title" data-act="info" aria-haspopup="dialog" aria-expanded="false"><span id="title"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5A50" stroke-width="1.6" aria-hidden="true" style="flex:none"><path d="M6 15l6-6 6 6"/></svg></button>
    <button type="button" class="chip price" id="price" data-act="cart-toggle" aria-pressed="false"><span id="price-text"></span>
      <svg id="bag-empty" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E2420" stroke-width="1.5" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8a3 3 0 0 1 6 0"/><path d="M12 11.5v5M9.5 14h5"/></svg>
      <svg id="bag-full" width="22" height="22" viewBox="0 0 24 24" fill="#2E2420" stroke="#2E2420" stroke-width="1.5" aria-hidden="true" hidden><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8a3 3 0 0 1 6 0" fill="none"/><path d="M9 14l2 2 4-4" stroke="#FAF6F0" fill="none"/></svg>
    </button>
  </div>

  <div class="band" id="band">
    <div class="thumbs">
      <button type="button" class="th" id="prev-th" data-act="go-prev"><span class="face"></span><span class="back-badge" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#2E2420" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></span></button>
      <div class="thumbs" id="nexts" role="group" aria-label="Volgende stukken"></div>
    </div>
    <button type="button" class="shop" data-act="menu" aria-label="Shop" aria-haspopup="true" aria-expanded="false"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>

  <div class="pop info" id="info" role="dialog" aria-label="Over dit stuk" hidden></div>
  <div class="pop menu" id="menu" role="menu" aria-label="Shop" hidden>
    <button type="button" role="menuitem" data-act="menu">Collectie</button>
    <button type="button" role="menuitem" data-act="menu">Mijn items</button>
    <button type="button" role="menuitem" data-act="cart-open">Winkelmand</button>
  </div>
  <div class="pop cart" id="cart" role="dialog" aria-label="Winkelmand" hidden></div>
</div>

<script>
(function () {
  // Voorbeeldstukken. `foto`: lokaal pad naar een eigen foto (niet in Git), of leeg voor de tekening.
  var ITEMS = [
    { title: 'Bruine vintage jas', price: '€ 150', amount: 150, foto: '', kleur: '#8A5A3C' },
    { title: 'Gevlekte jas met sjaalkraag', price: '€ [prijs]', amount: null, foto: '', kleur: '#B9A58E' },
    { title: 'Korte zwarte jas', price: '€ [prijs]', amount: null, foto: '', kleur: '#3B3431' },
    { title: 'Korte jas met reverskraag', price: '€ [prijs]', amount: null, foto: '', kleur: '#C9B8A6' },
    { title: 'Lange jas met capuchon', price: '€ [prijs]', amount: null, foto: '', kleur: '#A08672' }
  ];
  var PITCH = '[Verkooptekst van Nikki: wat dit stuk bijzonder maakt, staat en herkomst zoals zij die heeft vastgesteld.]';
  var SIZES = [['Borstbreedte', '[—] cm'], ['Ruglengte', '[—] cm'], ['Schouderbreedte', '[—] cm'], ['Mouwlengte', '[—] cm']];
  var CLOSE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function drawing(it) {
    // Eenvoudige getekende jas als plaatshouder; geen echte productfoto.
    return '<svg class="drawing" viewBox="0 0 300 420" preserveAspectRatio="xMidYMin slice" role="img" aria-label="Tekening: ' + esc(it.title.toLowerCase()) + '"><rect width="300" height="420" fill="#E9E1D6"/>' +
      '<path d="M120 70 L150 95 L180 70 L222 92 L240 220 L222 228 L214 150 L210 390 L90 390 L86 150 L78 228 L60 220 L78 92 Z" fill="' + it.kleur + '"/>' +
      '<path d="M120 70 L150 140 L180 70" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3"/><path d="M150 140 L150 390" stroke="rgba(0,0,0,0.18)" stroke-width="2"/></svg>';
  }
  function face(it) { return it.foto ? '<img src="' + esc(it.foto) + '" alt="' + esc(it.title) + '">' : drawing(it); }

  var $ = function (id) { return document.getElementById(id); };
  var ph = $('ph'), N = ITEMS.length;
  var S = { item: 0, photo: 0, prev: N - 1, liked: {}, cart: {}, zoom: false, open: null };
  var g = { start: null, axis: null, lastTap: 0, lastWheel: 0 };

  function renderTrack() {
    var it = ITEMS[S.item];
    $('track').innerHTML = '<div class="slide' + (S.zoom ? ' zoomed' : '') + '">' + face(it) + '</div>' +
      ['Achterkant volgt', 'Detail volgt'].map(function (t) {
        return '<div class="slide"><div class="hold" role="img" aria-label="' + t + '"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>' + t + '</span></div></div>';
      }).join('');
    place(0);
  }
  function place(dx) {
    $('track').style.transform = 'translateX(calc(' + (-S.photo * 100) + '% + ' + dx + 'px))';
    var d = ''; for (var k = 0; k < 3; k++) d += '<i' + (k === S.photo ? ' class="on"' : '') + '></i>';
    $('dots').innerHTML = d; $('dots').setAttribute('aria-label', 'Foto ' + (S.photo + 1) + ' van 3');
  }
  function render(fade) {
    var it = ITEMS[S.item], inCart = !!S.cart[S.item], liked = !!S.liked[S.item];
    $('title').textContent = it.title;
    $('price-text').textContent = it.price;
    $('price').setAttribute('aria-pressed', String(inCart));
    $('price').setAttribute('aria-label', it.price + (inCart ? ', in je winkelmand; tik om te verwijderen' : ', toevoegen aan winkelmand'));
    $('bag-empty').toggleAttribute('hidden', inCart); $('bag-full').toggleAttribute('hidden', !inCart);
    $('like').setAttribute('aria-pressed', String(liked));
    $('like').querySelector('svg').setAttribute('fill', liked ? '#FFFFFF' : 'none');
    var p = ITEMS[S.prev];
    $('prev-th').querySelector('.face').innerHTML = face(p);
    $('prev-th').setAttribute('aria-label', 'Terug naar ' + p.title);
    var h = '';
    for (var k = 1; k <= 3; k++) { var i = (S.item + k) % N; h += '<button type="button" class="th" data-act="go" data-idx="' + i + '" aria-label="Bekijk ' + esc(ITEMS[i].title) + '"><span class="face">' + face(ITEMS[i]) + '</span></button>'; }
    $('nexts').innerHTML = h;
    renderTrack();
    if (fade) { var el = $('photo'); el.classList.remove('wissel'); void el.offsetWidth; el.classList.add('wissel'); }
  }
  function goItem(i) { if (i === S.item) return; S.prev = S.item; S.item = i; S.photo = 0; S.zoom = false; closeAll(); render(true); }
  function goPhoto(step, wrap) {
    var p = S.photo + step; S.photo = wrap ? (p + 3) % 3 : Math.max(0, Math.min(2, p)); S.zoom = false;
    ph.querySelectorAll('.slide').forEach(function (s) { s.classList.remove('zoomed'); }); place(0);
  }

  function renderInfo() {
    var it = ITEMS[S.item];
    $('info').innerHTML = '<div class="head"><span></span><button type="button" class="ic" data-act="close" aria-label="Sluiten">' + CLOSE + '</button></div>' +
      '<div class="head" style="align-items:baseline;gap:16px"><span class="ptitle">' + esc(it.title) + '</span><span style="font-size:22px;white-space:nowrap">' + esc(it.price) + '</span></div>' +
      '<p style="margin:0;font-size:17px;line-height:1.55">' + PITCH + '</p>' +
      '<div><div class="muted" style="font-size:16px;padding-bottom:4px">Maten, plat gemeten</div>' +
      SIZES.map(function (s) { return '<div class="kv"><span>' + s[0] + '</span><span>' + s[1] + '</span></div>'; }).join('') + '</div>';
  }
  function renderCart() {
    var ids = Object.keys(S.cart).filter(function (k) { return S.cart[k]; }).map(Number);
    var total = ids.reduce(function (t, i) { return t + (ITEMS[i].amount || 0); }, 0);
    var unknown = ids.some(function (i) { return ITEMS[i].amount === null; });
    $('cart').innerHTML = '<div class="head" style="padding-bottom:10px"><button type="button" class="ic" data-act="close" aria-label="Terug naar de winkel" style="margin-left:-8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span style="font-size:26px">Winkelmand</span><span style="width:44px"></span></div>' +
      (ids.length ? ids.map(function (i) {
        return '<div class="line"><span class="face">' + face(ITEMS[i]) + '</span><div class="txt"><span>' + esc(ITEMS[i].title) + '</span><span>' + esc(ITEMS[i].price) + '</span></div>' +
          '<button type="button" class="ic" data-act="cart-remove" data-idx="' + i + '" aria-label="Verwijder ' + esc(ITEMS[i].title) + '">' + CLOSE + '</button></div>';
      }).join('') + '<div style="margin-top:auto;display:flex;flex-direction:column;gap:14px"><div class="kv" style="border:0;font-size:20px"><span>Totaal</span><span>€ ' + total + (unknown ? ' + [prijs]' : '') + '</span></div>' +
        '<button type="button" class="checkout" data-act="close">Afrekenen</button></div>'
      : '<p class="muted" style="margin:48px 0 0;text-align:center;font-size:18px">Je winkelmand is leeg.</p>');
  }

  var OPENER = { info: '[data-act="info"]', menu: '.shop' };
  function closeAll() {
    ['info', 'menu', 'cart'].forEach(function (k) { $(k).hidden = true; if (OPENER[k]) ph.querySelector(OPENER[k]).setAttribute('aria-expanded', 'false'); });
    S.open = null;
  }
  function open(k) {
    var was = S.open; closeAll(); if (was === k) return;
    if (k === 'info') { renderInfo(); $('info').style.bottom = (ph.clientHeight - $('row').offsetTop + 8) + 'px'; }
    if (k === 'menu') $('menu').style.bottom = (ph.clientHeight - $('band').offsetTop + 8) + 'px';
    if (k === 'cart') renderCart();
    $(k).hidden = false; S.open = k;
    if (OPENER[k]) ph.querySelector(OPENER[k]).setAttribute('aria-expanded', 'true');
  }

  ph.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'prev-photo') goPhoto(-1, true);
    else if (a === 'next-photo') goPhoto(1, true);
    else if (a === 'like') { S.liked[S.item] = !S.liked[S.item]; render(false); }
    else if (a === 'info' || a === 'menu') open(a);
    else if (a === 'cart-open') open('cart');
    else if (a === 'cart-toggle') { S.cart[S.item] = !S.cart[S.item]; render(false); }
    else if (a === 'cart-remove') { S.cart[Number(b.getAttribute('data-idx'))] = false; render(false); renderCart(); }
    else if (a === 'close') closeAll();
    else if (a === 'go') goItem(Number(b.getAttribute('data-idx')));
    else if (a === 'go-prev') goItem(S.prev);
  });
  ph.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.open) closeAll(); });

  // Vegen: opzij = andere foto van dit stuk, omhoog/omlaag = ander stuk. Twee keer tikken = inzoomen.
  var photo = $('photo');
  photo.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) { g.start = null; return; }
    g.start = { x: e.clientX, y: e.clientY }; g.axis = null;
    try { photo.setPointerCapture(e.pointerId); } catch (err) {}
  });
  photo.addEventListener('pointermove', function (e) {
    if (!g.start) return;
    var dx = e.clientX - g.start.x, dy = e.clientY - g.start.y;
    if (!g.axis && Math.max(Math.abs(dx), Math.abs(dy)) > 8) g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (g.axis === 'x' && !S.zoom) { var edge = (S.photo === 0 && dx > 0) || (S.photo === 2 && dx < 0); $('track').classList.add('dragging'); place(edge ? dx * 0.3 : dx); }
  });
  photo.addEventListener('pointercancel', function () { g.start = null; g.axis = null; $('track').classList.remove('dragging'); place(0); });
  photo.addEventListener('pointerup', function (e) {
    if (!g.start) return;
    var dx = e.clientX - g.start.x, dy = e.clientY - g.start.y, axis = g.axis;
    g.start = null; g.axis = null; $('track').classList.remove('dragging');
    if (!axis) {
      var now = Date.now();
      if (now - g.lastTap < 320 && S.photo === 0) {
        g.lastTap = 0; S.zoom = !S.zoom;
        var slide = ph.querySelector('.slide'), pic = slide.firstElementChild, r = photo.getBoundingClientRect();
        pic.style.transformOrigin = Math.round((e.clientX - r.left) / r.width * 100) + '% ' + Math.round((e.clientY - r.top) / r.height * 100) + '%';
        slide.classList.toggle('zoomed', S.zoom);
      } else g.lastTap = now;
      place(0); return;
    }
    if (S.zoom) { place(0); return; }
    if (axis === 'x' && Math.abs(dx) > 60) goPhoto(dx < 0 ? 1 : -1, false);
    else if (axis === 'y' && Math.abs(dy) > 50) goItem((S.item + (dy < 0 ? 1 : -1) + N) % N);
    else place(0);
  });
  photo.addEventListener('wheel', function (e) {
    if (Math.abs(e.deltaY) < 30) return;
    e.preventDefault();
    var now = Date.now(); if (now - g.lastWheel < 600) return; g.lastWheel = now;
    goItem((S.item + (e.deltaY > 0 ? 1 : -1) + N) % N);
  }, { passive: false });

  render(false);
})();
</script>
</body>
