<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF6F0">
<title>Beheer — ontwerp voor Nikki’s Boetiek</title>
<link rel="preload" href="Newsreader.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#inhoud">Naar de inhoud</a>
<header class="app-header">
  <div class="app-toolbar">
    <div class="brand-row">
      <span class="brand" translate="no">Nikki’s Boetiek</span>
      <div class="account-wrap">
        <button class="icon" id="account" aria-label="Account en hulp" aria-expanded="false" aria-controls="account-panel" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        </button>
        <div id="account-panel" class="account-panel" hidden>
          <nav aria-label="Bestemmingen">
            <button type="button">Boetiek</button>
            <button type="button" data-close>Jouw collectie</button>
          </nav>
          <p>Proefboetiek: bekijken en uitproberen, nog niet afrekenen.</p>
          <button type="button" id="logout" hidden>Uitloggen</button>
        </div>
      </div>
    </div>
    <nav class="navigation" aria-label="Schermen en acties">
      <span class="tip-wrap"><button type="button" class="icon" data-screen="shop" aria-label="Boetiek" aria-describedby="tip-shop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l2-6h14l2 6M3 9v2a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0V9H3ZM5 14v7h14v-7M9 21v-6h6v6"/></svg>
      </button><span class="tooltip" id="tip-shop" role="tooltip">Boetiek</span></span>
      <span class="tip-wrap"><button type="button" class="icon selected" data-screen="manage" aria-label="Jouw collectie" aria-pressed="true" aria-describedby="tip-manage">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button><span class="tooltip" id="tip-manage" role="tooltip">Jouw collectie</span></span>
      <span class="tip-wrap"><button type="button" class="icon" id="new" aria-label="Nieuw stuk" aria-describedby="tip-new" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
      </button><span class="tooltip" id="tip-new" role="tooltip">Nieuw stuk</span></span>
      <span class="tip-wrap refresh"><button type="button" class="icon" id="reload" aria-label="Collectie vernieuwen" aria-describedby="tip-reload">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M19.5 12a7.5 7.5 0 0 0-13-5M4.5 12a7.5 7.5 0 0 0 13 5"/></svg>
      </button><span class="tooltip" id="tip-reload" role="tooltip">Vernieuwen</span></span>
    </nav>
  </div>
</header>
<main id="inhoud" tabindex="-1">
  <section id="manage" aria-labelledby="collectie-titel">
    <div class="intro"><h1 id="collectie-titel">Jouw collectie</h1><p id="login-intro">Log in om je stukken te beheren.</p></div>
    <form id="login">
      <label for="email">E-mailadres</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="username" spellcheck="false" autocapitalize="none" required>
      <label for="password">Wachtwoord</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="error" id="login-error" role="alert" hidden></p>
      <button class="primary" type="submit">Inloggen</button>
    </form>
    <p id="empty" hidden>Nog geen stukken toegevoegd. Begin bij Nieuw stuk.</p>
    <ul id="items"></ul>
    <p id="status" role="status"></p>
  </section>
</main>
<script src="mock.js"></script>
</body>
</html>
