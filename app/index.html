<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF6F0"><title>Guaranteed Secondhand Fur</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Guaranteed"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"><link rel="stylesheet" href="style.css"></head>
<body data-screen="shop"><header class="app-header"><div class="app-toolbar"><strong class="brand-name" aria-label="Guaranteed Secondhand Fur"><span>Guaranteed</span><span>Secondhand Fur</span></strong><nav aria-label="Schermen">
<button data-screen="shop" aria-label="Boetiek" title="Boetiek" data-icon="hanger" aria-pressed="true"></button>
<button id="reload" aria-label="Collectie vernieuwen" title="Collectie vernieuwen" data-icon="refresh"></button>
<button data-screen="manage" aria-label="Jouw collectie" title="Jouw collectie" data-icon="account" aria-pressed="false"></button></nav></div></header>
<div class="app-messages"><p id="status" role="status">Collectie laden…</p></div>
<main><iframe id="shop" title="Boetiek"></iframe><iframe id="intake" title="Kledingstuk invoeren" hidden></iframe>
<section id="manage" data-auth="guest" hidden><div class="manage-content"><div class="manage-heading"><h1 id="manage-title" tabindex="-1">Welkom terug</h1><div id="manage-actions" hidden>
<button id="logout" hidden aria-label="Uitloggen" title="Uitloggen" data-icon="logout"></button></div></div>
<form id="login" data-mode="login"><p id="login-intro">Log in voor jouw collectie.</p><div class="login-email"><label for="email">E-mailadres</label><input id="email" name="email" type="email" autocomplete="username" spellcheck="false" required></div>
<div class="login-password"><label for="password" id="password-label">Wachtwoord</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="login-error" required><button type="button" id="password-toggle" aria-label="Wachtwoord tonen">Tonen</button></div></div>
<p id="login-error" role="alert"></p><p id="login-done" role="status"></p><button type="submit">Inloggen</button><button type="button" id="forgot">Wachtwoord vergeten?</button><p class="login-note">Alleen voor Nikki en de beheerders.</p></form>
<p id="empty" hidden>Nog geen stukken toegevoegd. Begin bij Nieuw stuk.</p><ul id="items"><li class="new-card"><button data-screen="intake" id="new" hidden aria-label="Nieuw stuk" aria-pressed="false"><span class="piece-photo new-tile" aria-hidden="true"><span class="new-mark" data-icon="hanger"><span class="new-plus">+</span></span></span><span class="piece-title">Nieuw stuk</span><span class="piece-price">Toevoegen</span></button></li></ul></div>
<p id="trial-note">Proefboetiek · nog niet afrekenen</p></section></main>
<script type="module" src="main.js"></script></body></html>
