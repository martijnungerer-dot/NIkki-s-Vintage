003c/p>\n    \u003cdiv class=\"pickers\">\n      \u003clabel class=\"picker\" for=\"cam\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#i-cam\">\u003c/use>\u003c/svg>\u003cspan>Foto maken\u003c/span>\u003cinput id=\"cam\" type=\"file\" accept=\"image/*\" capture=\"environment\">\u003c/label>\n      \u003clabel class=\"picker\" for=\"gallery\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#i-cam\">\u003c/use>\u003c/svg>\u003cspan>Uit galerij\u003c/span>\u003cinput id=\"gallery\" type=\"file\" accept=\"image/*\" multiple>\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"thumbs\" id=\"thumbs\">\u003c/div>\n    \u003cp class=\"muted\" id=\"photo-count\">Voeg eerst een foto toe.\u003c/p>\n    \u003cp class=\"notice\" id=\"ai-off\" hidden>\u003c/p>\n    \u003cbutton type=\"button\" class=\"btn\" id=\"analyse\" disabled>Verwerken\u003c/button>\n    \u003cbutton type=\"button\" class=\"linkbtn\" id=\"manual\">Liever zelf invullen\u003c/button>\n  \u003c/section>\n\n  \u003c!-- STEP 2: processing -->\n  \u003csection id=\"step-thinking\" class=\"stack\" hidden>\n    \u003ch1>Bezig met verwerken\u003c/h1>\n    \u003cdiv class=\"thinking\" role=\"status\">\u003cspan class=\"dot\">\u003c/span>\u003cspan id=\"think-msg\">Even geduld. Dit kan een halve minuut duren.\u003c/span>\u003c/div>\n    \u003cbutton type=\"button\" class=\"linkbtn\" id=\"stop\">Stoppen\u003c/button>\n  \u003c/section>\n\n  \u003c!-- STEP 3: checklist -->\n  \u003csection id=\"step-review\" class=\"stack\" hidden>\n    \u003ch1>Controleren\u003c/h1>\n    \u003cp class=\"muted\" id=\"review-intro\">Tik aan wat klopt. Groene stip = voorstel. Typ alleen wat nieuw is.\u003c/p>\n    \u003cdiv id=\"warnings\" class=\"stack\">\u003c/div>\n    \u003cdiv class=\"path\" id=\"path\">\u003c/div>\n    \u003cp class=\"err\" id=\"review-err\" role=\"status\">\u003c/p>\n    \u003cdiv class=\"bar\">\u003cbutton type=\"button\" class=\"btn\" id=\"publish\" disabled>Publiceren (proef)\u003c/button>\u003c/div>\n    \u003cp class=\"learn\" id=\"learned\">\u003c/p>\n    \u003cbutton type=\"button\" class=\"linkbtn\" id=\"back-photos\">Terug naar foto's\u003c/button>\n  \u003c/section>\n\n  \u003c!-- STEP 4: done -->\n  \u003csection id=\"step-done\" class=\"stack\" hidden>\n    \u003ch1>Zo ziet publicatie eruit\u003c/h1>\n    \u003cp class=\"muted\">Proef: er is niets opgeslagen of gepubliceerd.\u003c/p>\n    \u003cdiv class=\"card\">\u003cdiv class=\"preview\">\u003cdiv id=\"pv-img\">\u003c/div>\u003cdiv class=\"stack\" style=\"gap: 6px; min-width: 0;\">\u003ch2 id=\"pv-title\">\u003c/h2>\u003cp id=\"pv-price\" class=\"muted\">\u003c/p>\u003cdiv class=\"tags\" id=\"pv-tags\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n    \u003ch2>Voorbeeld van passende klanten\u003c/h2>\n    \u003cp class=\"muted\">Verzonnen voorbeeldklanten. In deze proef wordt niets verstuurd.\u003c/p>\n    \u003cdiv class=\"card\" id=\"matches\">\u003c/div>\n    \u003cp class=\"learn\" id=\"learned-done\">\u003c/p>\n    \u003cbutton type=\"button\" class=\"btn\" id=\"again\">Volgend stuk\u003c/button>\n  \u003c/section>\n\u003c/div>\n\n\u003cscript>\n(function () {\n  var $ = function (id) { return document.getElementById(id); };\n  function esc(s) { return String(s).replace(/[&\u003c>\"]/g, function (c) { return { '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]; }); }\n\n  // ---------- learned options (per browser; stands in for server-side learning) ----------\n  var store = {\n    get: function (k, d) { try { var v = localStorage.getItem('gsf-' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },\n    set: function (k, v) { try { localStorage.setItem('gsf-' + k, JSON.stringify(v)); } catch (e) {} }\n  };\n  var BASE = {\n    bont: ['Ja', 'Alleen kraag of rand', 'Nee'],\n    materiaal: ['Bont', 'Leer', 'Suède', 'Shearling', 'Wol', 'Anders'],\n    model: ['Sjaalkraag', 'Reverskraag', 'Opstaande kraag', 'Capuchon', 'Pilotenjack', 'Autojas', 'Trenchcoat', 'Cape', 'Bolero', 'Kort jack', 'Overslag met ceintuur'],\n    kleur: ['Zwart', 'Donkerbruin', 'Bruin', 'Cognac', 'Camel', 'Honing', 'Crème', 'Wit', 'Zilvergrijs', 'Grijs'],\n    lengte: ['Kort', 'Heuplang', 'Knielang', 'Lang'],\n    pasvorm: ['Recht', 'Getailleerd', 'Boxy', 'Oversized'],\n    periode: ['Jaren 50', 'Jaren 60', 'Jaren 70', 'Jaren 80', 'Jaren 90', 'Onbekend'],\n    bontsoort: ['Nerts', 'Vos', 'Persianer', 'Konijn', 'Bisam', 'Wasbeer', 'Lam'],\n    bijzonderheden: ['Bontkraag', 'Bontmanchetten', 'Ceintuur', 'Opgestikte zakken', 'Origineel label', 'Monogram', 'Zijden voering', 'Voering vernieuwd', 'Reparatie', 'Kale plek', 'Vlek', 'Ontbrekende knoop', 'Geen']\n  };\n  var learned = store.get('learned', {});\n  function options(key) {\n    var list = BASE[key].concat(learned[key] || []);\n    var s = sug[key] && sug[key].waarde;\n    (Array.isArray(s) ? s : s ? [s] : []).forEach(function (v) { if (list.indexOf(v) \u003c 0) list.push(v); });\n    return list;\n  }\n  function learn(key, value) {\n    learned[key] = learned[key] || [];\n    if (BASE[key].indexOf(value) \u003c 0 && learned[key].indexOf(value) \u003c 0) { learned[key].push(value); store.set('learned', learned); }\n  }\n\n  // ---------- state ----------\n  var ROLES = ['Voorkant', 'Achterkant', 'Label', 'Detail', 'Gebrek', 'Voering', 'Sluiting', 'Overig'];\n  var photos = [];      // {file, url, rol, toelichting, ok, bruikbaar}\n  var sug = {};         // key -> {waarde, zekerheid, waarom}\n  var sel = {};         // key -> value (string) or array for bijzonderheden\n  var m = { chest: '', shoulder: '', sleeve: '', length: '' };\n  var text = { titel: '', beschrijving: '', prijs: '' };\n  var speciesChecked = false;\n  var open = 'fotos';\n  var adding = null;    // key with open \"+ nieuw\" input\n  var sample = null, limits = null, ctl = null;\n\n  var PROFILES = [\n    { name: 'Voorbeeldklant A', likes: ['nerts', 'lang', 'jaren 70', 'sjaalkraag'], chest: 56 },\n    { name: 'Voorbeeldklant B', likes: ['vos', 'kor n(', '); }).join('\\n');\n    return [\n      'Je helpt Nikki, die een tweedehandswinkel heeft in vintage bont, leer en shearling, met het invoeren van één kledingstuk.',\n      'De foto\\'s tonen hetzelfde stuk in willekeurige volgorde. Geef elke foto (nr 1, 2, 3 ... in de volgorde waarin je ze krijgt) een plek: ' + ROLES.join(', ') + ', en zeg of hij bruikbaar is (scherp, goed belicht).',\n      'Kies per kenmerk bij voorkeur uit deze lijsten. Past niets, geef dan een korte nieuwe waarde:',\n      lists,\n      'Regels: gok niet; onzeker = waarde null en zekerheid \"laag\". Bontsoort alleen met zichtbare kenmerken en leg uit waarom. Mogelijk honden- of kattenbont of een beschermde soort: zet het in \"waarschuwingen\". Labeltekst en merk alleen als letterlijk leesbaar. Geen maten. Geen echtheids- of herkomstclaims. Periode alleen als die echt af te leiden is.',\n      'Schrijf in het Nederlands. Titel kort, bijvoorbeeld \"Lange nertsjas met sjaalkraag\". Beschrijving: twee rustige zinnen, alleen wat zichtbaar is.',\n      'Antwoord met alleen dit JSON-object:',\n      '{\"titel\": string, \"beschrijving\": string, \"labeltekst\": string|null,',\n      ' \"materiaal\": {\"waarde\": string|null, \"zekerheid\": \"hoog\"|\"middel\"|\"laag\", \"waarom\": string}, \"model\": {...}, \"kleur\": {...}, \"lengte\": {...}, \"pasvorm\": {...}, \"periode\": {...}, \"bontsoort\": {...},',\n      ' \"bijzonderheden\": {\"waarde\": [string], \"zekerheid\": ..., \"waarom\": string}, \"bont\": {\"waarde\": \"Ja\"|\"Alleen kraag of rand\"|\"Nee\"|null, \"zekerheid\": ..., \"waarom\": string},',\n      ' \"waarschuwingen\": [string], \"fotos\": [{\"nr\": number, \"rol\": string, \"toelichting\": string, \"bruikbaar\": boolean}]}'\n    ].join('\\n');\n  }\n  $('analyse').addEventListener('click', function () {\n    if (!sample) return;\n    var max = (limits && limits.images && limits.images.maxCount) || 4;\n    var files = photos.slice(0, max).map(function (p) { return p.file; });\n  rows = PROFILES.map(function (c) {\n      var hits = c.likes.filter(function (l) { return lower.some(function (t) { return t.indexOf(l) >= 0 || l.indexOf(t) >= 0; }); });\n      return { c: c, hits: hits, fit: chest == null ? null : Math.abs(chest - c.chest) \u003c= 2 };\n    }).filter(function (r) { return r.hits.length && r.fit !== false; }).sort(function (a, b) { return b.hits.length - a.hits.length; });\n    $('matches').innerHTML = rows.length ? rows.map(function (r) {\n      return '\u003cdiv class=\"match\">\u003cspan>' + r.c.name + '\u003c/span>\u003cspan class=\"muted\">' + r.hits.join(', ') + (r.fit ? ' · borstmaat komt in de buurt' : '') + '\u003c/span>\u003c/div>';\n    }).join('') : '\u003cp class=\"muted\">Geen van de voorbeeldklanten past bij dit stuk.\u003c/p>';\n    $('learned-done').textContent = corrections ? corrections + ' aanpassing' + (corrections === 1 ? '' : 'en') + ' op de voorstellen onthouden (' + total + ' in totaal). In de echte versie maken die de voorstellen beter.' : '';\n    step(4);\n  });\n  $('again').addEventListener('click', function () { photos.forEach(function (p) { URL.revokeObjectURL(p.url); }); photos = []; resetItem(); renderThumbs(); step(1); });\n\n  // ---------- start ----------\n  function off(msg) { sample = null; $('ai-off').textContent = msg; $('ai-off').hidden = false; renderThumbs(); }\n  resetItem(); renderThumbs(); step(1);\n  off('Vul je stuk zelf in. Automatische fotoanalyse is in deze proef niet aangesloten.');\n// Runs inside the intake closure. Files become durable data URLs before handoff.\nlet draftId = null;\nlet sending = false;\n$('again').addEventListener('click', () => { draftId = null; });\n$('publish').textContent = 'Toevoegen aan proefwinkel';\n$('publish').addEventListener('click', async event => {\n  event.stopImmediatePropagation();\n  if (sending || !STEPS.every(s => s.done())) return;\n  sending = true; $('publish').disabled = true;\n  $('review-err').textContent = 'Foto’s voorbereiden…';\n  try {\n    if (photos.length > 8) throw Error('Gebruik maximaal acht foto’s per oefenstuk.');\n    const images = await Promise.all(photos.map(p => new Promise((resolve, reject) => {\n      if (!['image/jpeg','image/png','image/webp'].includes(p.file.type) || p.file.size > 8*1024*1024) {\n        reject(Error('Gebruik JPG, PNG of WebP van maximaal 8 MB per foto.')); return;\n      }\n      const reader = new FileReader();\n      reader.onerror = () => reject(Error('Een foto kon niet worden gelezen.'));\n      reader.onload = () => resolve({src:reader.result, role:p.rol || 'Detail', main:p === mainPhoto()});\n      reader.readAsDataURL(p.file);\n    })));\n    draftId ||= 'stuk-' + Date.now() + '-' + Math.random().toString(36).slice(2);\n    const product = {\n      key:draftId, title:text.titel.trim(), description:text.beschrijving.trim(),\n      priceMinor:Math.round(Number(text.prijs)*100), material:sel.materiaal,\n      species:needsSpecies()?sel.bontsoort:null, model:sel.model, colour:sel.kleur,\n      length:sel.lengte, fit:sel.pasvorm || '', era:sel.periode || '',\n      details:sel.bijzonderheden.slice(),\n      measurements:[m.chest,m.shoulder,m.sleeve,m.length].map(v=>v===''?null:Number(v)), images\n    };\n    window.parent.NikkiApp.publish(product);\n    $('review-err').textContent = 'Toegevoegd aan de proefwinkel. Pas dit stuk verder aan of kies Volgend stuk.';\n    $('publish').textContent = 'Wijziging in proefwinkel bijwerken';\n  } catch(error) { $('review-err').textContent = error.message; }\n  finally { sending=false; refresh(); }\n}, true);\nconst next = document.createElement('button');\nnext.type='button'; next.className='btn ghost'; next.textContent='Volgend stuk'; next.id='new-draft';\nnext.addEventListener('click',()=>{ $('again').click(); $('publish').textContent='Toevoegen aan proefwinkel'; });\n$('back-photos').after(next);\n\n})();\n\u003c/script>\n\n\n\u003c/html>\n"</script><script>// Orchestrates two mounted views. Local storage is optional; HTML export is portable.

 if(!p || typeof p.key!=='string' || typeof p.title!=='string' || !p.title.trim() ||
