<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nikki’s Boetiek</title><link rel="stylesheet" href="style.css"></head>
<body data-screen="shop"><header class="app-header"><div class="app-toolbar"><strong>Nikki’s Boetiek</strong><nav aria-label="Schermen"><button data-screen="shop" aria-pressed="true">Boetiek</button><button data-screen="manage" aria-pressed="false">Beheer</button><button data-screen="intake" id="new" hidden aria-pressed="false">Nieuw stuk</button></nav><div class="app-actions"><button id="reload">Collectie vernieuwen</button><button id="logout" hidden>Uitloggen</button></div></div></header>
<div class="app-messages"><p id="status" role="status">Collectie laden…</p><p class="notice">Proefboetiek · bekijken en uitproberen, nog niet afrekenen.</p></div>
<main><iframe id="shop" title="Boetiek"></iframe><iframe id="intake" title="Kledingstuk invoeren" hidden></iframe>
<section id="manage" hidden><h1>Jouw collectie</h1>
<form id="login"><p>Log in om kledingstukken toe te voegen en aan te passen.</p><label>E-mailadres<input id="email" type="email" autocomplete="username" required></label><label>Wachtwoord<input id="password" type="password" autocomplete="current-password" required></label><button>Inloggen</button></form>
<p id="empty" hidden>Nog geen stukken toegevoegd. Begin bij Nieuw stuk.</p><ul id="items"></ul></section></main>
<script type="module" src="main.js"></script></body></html>
